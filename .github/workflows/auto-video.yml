name: auto-video

# AI 자동 콘텐츠 영상 워커 — 대본까지 끝난 칸(SCRIPTED)의 소재를 만들고 편집 키트로 완성본을 만든다(worker/make-auto-videos.ts).
# 대본 워커(b-plan)가 끝나면 바로 돌고, 화면의 "다시 만들기"가 auto-video로 깨운다. schedule은 트리거가 실패했을 때의 백업이다.
# AUTO_VIDEO_PUBLISH=1이고 경고가 없을 때만 사람 확인 없이 발행 대기열로 간다(기본 꺼짐).
# 영상 단계는 기본이 lemo 코드 애니메이션이다(2026-11-11). 안 되면 사진 · 스톡 컷으로 만든다.
# 러너 변수 AUTO_VIDEO_ENGINE=kit이면 lemo 준비 · 실행을 건너뛰고 예전처럼 사진 · 스톡 컷만 쓴다.
on:
  workflow_run:
    workflows: [b-plan]
    types: [completed]
  schedule:
    - cron: "37 * * * *"
  repository_dispatch:
    types: [auto-video]
  workflow_dispatch:
    inputs:
      plan:
        description: "이 칸만 만들기 (비우면 만들 칸 전부)"
        required: false
      dry_run:
        description: "만들기만 하고 저장 · 발행하지 않기 (결과는 실행 기록의 파일로)"
        type: boolean
        default: false
      use_draft_knowledge:
        description: "승인 전 상식 카드 · 우리 차이 초안도 쓰기 (dry_run 전용, 저장 안 됨)"
        type: boolean
        default: false

# 저장하지 않는 시험은 칸을 차지하지 않으니 상품별로 동시에 돌린다
concurrency:
  group: ${{ inputs.dry_run && format('auto-video-dry-{0}', inputs.plan) || 'auto-video-worker' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # lemo-opuscar 고정 커밋(lib/lemo/README.md, lemo-video.yml과 같게 둔다)
  LEMO_OPUSCAR_REPO: https://github.com/lemomo-ai/lemo-opuscar.git
  LEMO_OPUSCAR_COMMIT: 9eb7739a0fca4c6990fe966cb8b87b1930f7193a

jobs:
  make:
    runs-on: ubuntu-latest
    # lemo 렌더는 GPU 없는 러너에서 소프트웨어로 그려 느리다. 칸 여러 개를 이어 만들 수 있어 여유를 둔다
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        if: ${{ vars.AUTO_VIDEO_ENGINE == 'kit' }}
        # 실행 환경에 있는 도구를 재사용한다. 자막은 저장소/영상별 웹폰트를 써 OS 한글폰트가 필요 없다.
        # apt 저장소가 응답하지 않아 영상 제작 전 무한히 기다리던 경우를 막는다.
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            timeout 120s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
            timeout 120s sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      # lemo 렌더는 apt의 ffmpeg 6.1로는 오래돼 정적 빌드(8.1, 없으면 9.0)를 받는다(lemo-video.yml과 같다). lemo가 실패해 사진 · 스톡 컷으로 넘어가도 같은 ffmpeg를 쓴다
      # BtbN latest 릴리스는 오래된 판을 내린다(2026-11-11 n7.1이 404로 영상 제작 전체가 멈췄다). 다 못 받으면 apt ffmpeg로라도 영상은 만든다
      - name: Install ffmpeg 8
        if: ${{ vars.AUTO_VIDEO_ENGINE != 'kit' }}
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          ok=""
          for v in 8.1 9.0; do
            if curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffmpeg.tar.xz" "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n$v-latest-linux64-gpl-$v.tar.xz" \
              && tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1; then ok=1; break; fi
          done
          if [ -n "$ok" ]; then
            echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/ffmpeg/bin/ffmpeg" -version | head -1
          else
            echo "::warning::ffmpeg 정적 빌드를 못 받아 apt ffmpeg를 쓴다(lemo는 사진 · 스톡 컷으로 넘어갈 수 있다)"
            if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
              timeout 120s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
              timeout 120s sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y -qq --no-install-recommends ffmpeg
            fi
            ffmpeg -version | head -1
          fi
      # 준비가 실패해도 영상은 만든다 — lemo가 렌더 환경 점검에서 멈추고 사진 · 스톡 컷으로 넘어간다
      - name: Prepare lemo-opuscar
        if: ${{ vars.AUTO_VIDEO_ENGINE != 'kit' }}
        continue-on-error: true
        run: |
          git clone --quiet "$LEMO_OPUSCAR_REPO" "$RUNNER_TEMP/lemo-opuscar"
          cd "$RUNNER_TEMP/lemo-opuscar"
          git checkout --quiet "$LEMO_OPUSCAR_COMMIT"
          npm ci --no-audit --no-fund
          timeout 600s node node_modules/playwright-core/cli.js install --with-deps chromium-headless-shell
          echo "LEMO_OPUSCAR_HOME=$PWD" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lib/shoot/video-kit/py/requirements.txt
      - run: pip install -q -r lib/shoot/video-kit/py/requirements.txt
      # 배경 제거 · 깊이 모델은 한 번만 내려받는다
      - uses: actions/cache@v4
        with:
          path: |
            ~/.u2net
            ~/.cache/mcb-depth
          key: video-models-v1
      - name: Prepare HyperFrames browser
        run: npx --yes hyperframes@0.8.210 browser ensure
      # 구매한 자막 모션 스킬은 저장소에 넣지 않고 비공개 저장 공간에서 받는다. 실패하면 기본 자막으로 만든다
      - name: Prepare caption skill
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npx tsx worker/fetch-caption-skill.ts "$RUNNER_TEMP/caption-skill"
          cd "$RUNNER_TEMP/caption-skill/caption-motion-seqc"
          npm ci --no-audit --no-fund --silent
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "CAPTION_SKILL_DIR=$PWD" >> "$GITHUB_ENV"
      - name: Make videos
        run: npm run worker:auto-video -- ${{ inputs.plan && format('--plan {0}', inputs.plan) || '' }} ${{ inputs.dry_run && '--dry-run --out dry-out' || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ vars.FISH_VOICE_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AUTO_VIDEO_PUBLISH: ${{ vars.AUTO_VIDEO_PUBLISH }}
          AUTO_VIDEO_ENGINE: ${{ vars.AUTO_VIDEO_ENGINE }}
          # GPU 없는 러너에서 WebGL 스타일을 그리려면 소프트웨어 렌더러가 필요하다(느림)
          LEMO_ANGLE: swiftshader
          VIDEO_PYTHON: python
          TEST_USE_DRAFT_KNOWLEDGE: ${{ inputs.use_draft_knowledge && '1' || '' }}
      - name: Keep dry-run result
        if: ${{ inputs.dry_run && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: auto-video-dry-run
          path: dry-out
          retention-days: 3
          if-no-files-found: ignore
