name: auto-video

# AI 자동 콘텐츠 영상 워커 — 대본까지 끝난 칸(SCRIPTED)의 소재를 만들고 편집 키트로 완성본을 만든다(worker/make-auto-videos.ts).
# 대본 워커(b-plan)가 끝나면 바로 돌고, 화면의 "다시 만들기"가 auto-video로 깨운다. schedule은 트리거가 실패했을 때의 백업이다.
# AUTO_VIDEO_PUBLISH=1이고 경고가 없을 때만 사람 확인 없이 발행 대기열로 간다(기본 꺼짐).
on:
  workflow_run:
    workflows: [b-plan]
    types: [completed]
  schedule:
    - cron: "37 * * * *"
  repository_dispatch:
    types: [auto-video]
  workflow_dispatch:
    inputs:
      plan:
        description: "이 칸만 만들기 (비우면 만들 칸 전부)"
        required: false
      dry_run:
        description: "만들기만 하고 저장 · 발행하지 않기 (결과는 실행 기록의 파일로)"
        type: boolean
        default: false
      test_tone:
        description: "시험에서만 쓸 말투 · 분위기 (dry_run 전용, 저장 안 됨)"
        required: false

concurrency:
  group: auto-video-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-nanum > /dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lib/shoot/video-kit/py/requirements.txt
      - run: pip install -q -r lib/shoot/video-kit/py/requirements.txt
      # 배경 제거 · 깊이 모델은 한 번만 내려받는다
      - uses: actions/cache@v4
        with:
          path: |
            ~/.u2net
            ~/.cache/mcb-depth
          key: video-models-v1
      - name: Prepare HyperFrames browser
        run: npx --yes hyperframes@0.8.210 browser ensure
      - name: Make videos
        run: npm run worker:auto-video -- ${{ inputs.plan && format('--plan {0}', inputs.plan) || '' }} ${{ inputs.dry_run && '--dry-run --out dry-out' || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ vars.FISH_VOICE_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          AUTO_VIDEO_PUBLISH: ${{ vars.AUTO_VIDEO_PUBLISH }}
          VIDEO_PYTHON: python
          TEST_AUTO_TONE: ${{ inputs.test_tone }}
      - name: Keep dry-run result
        if: ${{ inputs.dry_run && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: auto-video-dry-run
          path: dry-out
          retention-days: 3
          if-no-files-found: ignore
