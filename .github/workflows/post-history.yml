name: post-history

# 게시물 성과 워커(worker/sync-post-history.ts) — 지난 릴스 전체 성과 · 표지 보관 · 통계와 AI 해석.
#   · schedule 매일 05:10 KST — 성과 수집(04:00) · 비교 수집(04:50) 뒤
#   · workflow_dispatch — 수동 실행 (force_ai: 7일 안 지났어도 해석 새로)
# 인스타는 읽기만 한다. 지난 릴스가 많으면 시간 예산(40분)을 넘긴 부분은 다음 실행이 이어 읽는다.
on:
  schedule:
    - cron: "10 20 * * *"
  workflow_dispatch:
    inputs:
      force_ai:
        description: "7일 안 지났어도 AI 해석을 새로"
        type: boolean
        default: false

concurrency:
  group: post-history-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post-history:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync post history
        run: npm run worker:post-history -- ${FORCE_AI:+--force-ai}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          IG_DISCOVERY_TOKEN: ${{ secrets.IG_DISCOVERY_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          FORCE_AI: ${{ inputs.force_ai && 'true' || '' }}
