name: style-shorts-edit

# 스타일 쇼츠(/style-shorts) 편집 워커 — 찍은 영상을 레퍼런스 스타일 카드대로 편집한다(worker/edit-style-shorts.ts).
# 직접 촬영과 같은 편집 키트(ffmpeg · HyperFrames · 자막 모션 스킬)에 효과음만 earshot(고정 커밋)으로 만든다.
# 화면에서 만들기 · 다시 만들기를 누르면 바로 깨운다. schedule은 트리거가 실패했을 때의 백업(하루 두 번).
on:
  schedule:
    # 12:53 · 20:53 KST
    - cron: "53 3,11 * * *"
  repository_dispatch:
    types: [style-edit]
  workflow_dispatch:
    inputs:
      version:
        description: "이 버전만 편집 (비우면 대기 중인 것 전부)"
        required: false
      dry_run:
        description: "편집만 하고 저장하지 않기"
        type: boolean
        default: false

concurrency:
  group: style-shorts-edit
  cancel-in-progress: false

permissions:
  contents: read

env:
  EARSHOT_REF: 591fa3e028032e6dce56620a20e932e35667e8d8

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 설치된 패키지 폴더를 통째로 캐시한다. package-lock.json이 그대로면 npm ci(약 40초)를 건너뛴다
      - uses: actions/cache@v4
        id: node-modules
        with:
          path: node_modules
          key: style-edit-node22-modules-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.node-modules.outputs.cache-hit != 'true'
      # 받은 설치 파일(.deb)을 캐시해 다음 실행은 내려받지 않는다. 캐시를 쓰는 설치가 실패하면 예전 방식으로 설치한다
      - uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: style-edit-apt-${{ runner.os }}-v1
      # 저장소 서버가 느릴 때 오래 멈추지 않게 시간 제한 · 재시도를 건다(2026-11-20: 이 단계가 14.7분 걸린 실행이 있었다)
      - name: Install ffmpeg and Korean font
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          mkdir -p "$HOME/apt-archives/partial"
          sudo apt-get update -qq $APT
          sudo apt-get install -y -qq $APT -o Dir::Cache::Archives="$HOME/apt-archives" ffmpeg fonts-nanum > /dev/null \
            || sudo apt-get install -y -qq $APT ffmpeg fonts-nanum > /dev/null
          sudo chown -R "$USER" "$HOME/apt-archives" || true
          rm -rf "$HOME/apt-archives/partial" "$HOME/apt-archives/lock"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: style-edit-pip-${{ env.EARSHOT_REF }}-${{ hashFiles('lib/shoot/video-kit/py/requirements.txt') }}
      # 글자가 상품 · 사람을 피하게 자리를 읽는 도구. 없으면 기본 자리에 둔다
      - run: pip install -q -r lib/shoot/video-kit/py/requirements.txt
        continue-on-error: true
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: video-models-v1
      # 효과음(earshot 소리 묶음) · 배경음악 후보 판정. 설치가 실패하면 효과음 없이 만들고, 음악은 제목 · 태그로 골라 경고를 남긴다
      - name: Install earshot
        continue-on-error: true
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q "earshot @ git+https://github.com/Leonxlnx/earshot@${EARSHOT_REF}"
      # 배경음악 후보의 소리를 재는 모델(~1.1GB). 레퍼런스 분석(style-shorts.yml)과 같은 캐시를 쓴다
      - uses: actions/cache@v4
        with:
          path: ~/.earshot
          key: earshot-models-${{ env.EARSHOT_REF }}
      - name: Prepare HyperFrames browser
        run: npx --yes hyperframes@0.8.210 browser ensure
        continue-on-error: true
      # 구매한 자막 모션 스킬은 저장소에 넣지 않고 비공개 저장 공간에서 받는다. 실패하면 기본 자막으로 만든다
      - name: Prepare caption skill
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npx tsx worker/fetch-caption-skill.ts "$RUNNER_TEMP/caption-skill"
          cd "$RUNNER_TEMP/caption-skill/caption-motion-seqc"
          npm ci --no-audit --no-fund --silent
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "CAPTION_SKILL_DIR=$PWD" >> "$GITHUB_ENV"
      - name: Edit style shorts
        run: npm run worker:style-edit -- ${{ inputs.version && format('--version {0}', inputs.version) || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ vars.FISH_VOICE_ID }}
          VIDEO_PYTHON: python
          EARSHOT_PYTHON: python
          EARSHOT_HOME: /home/runner/.earshot
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
