name: a-plan

# 직접 촬영 콘텐츠 워커 — 계정별 촬영 기획 목록을 정리하고 부족한 만큼 채우고(plan-a-slots.ts),
# 사람이 고르거나 상품을 직접 추가한 기획은 촬영 컷 리스트 · 화면 문구 · 캡션을 쓴다(write-a-shotlists.ts).
# 고르는 즉시 화면이 a-shotlist로 이 워크플로를 깨운다(사람이 촬영을 기다리므로).
on:
  schedule:
    # 05:00 KST(20:00 UTC) 판매 중 확인 · 14일 지난 기획 교체 · 계정당 5개로 채우기.
    - cron: "0 20 * * *"
  repository_dispatch:
    types: [plan-a, a-shotlist]
  workflow_dispatch: {}

concurrency:
  group: a-plan-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan-a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 모든 실행에서 돈다 — 대기 중인 "새로 고침" 실행이 컷 리스트 실행으로 바뀌어도(같은 concurrency 그룹)
      # 목록이 다시 채워지게. 5개가 다 있으면 AI를 부르지 않아 비용이 들지 않는다.
      - name: Plan shoot ideas
        run: npm run worker:plan-a
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
      # 고른 칸의 컷 리스트 + 점검. 한국어 채점 스크립트(.claude/skills/ig-*-ko)가 파이썬이라 러너의 python3를 쓴다.
      - name: Write shot lists for chosen slots
        if: ${{ !cancelled() }}
        run: npm run worker:a-shotlist
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
