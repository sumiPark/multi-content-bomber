name: products

# 상품 수집 워커(worker/collect-products.ts) — 오늘과일 · 쿠마마켓 · 리유 상품을 공개 API로 받는다.
# 수집이 끝나면 같은 run에서 상세 이미지 분석(worker/analyze-products.ts)을 이어 붙인다.
on:
  # 매일 03시(KST) = 18시(UTC). 하루 한 번이면 되고, 몇 시간 밀려도 괜찮다.
  schedule:
    - cron: "0 18 * * *"
  # 상품 화면의 "지금 수집" 버튼.
  repository_dispatch:
    types: [collect-products]
  # 수동 실행(디버깅용).
  workflow_dispatch: {}

concurrency:
  group: products-worker
  cancel-in-progress: false

# 분석이 시간 예산에 걸리면 워커가 GITHUB_TOKEN으로 repository_dispatch를 보내 다음 run을 깨운다.
# (repository_dispatch는 GITHUB_TOKEN으로 만든 이벤트도 새 run을 띄우는 예외 이벤트 — episode-alerts.yml과 같은 방식)
permissions:
  contents: write

jobs:
  collect-products:
    runs-on: ubuntu-latest
    # 수집(1~2분) + 상세 이미지 분석(analyze-products가 45분 예산 안에서 스스로 멈춤).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 필수 — @supabase/realtime-js가 전역 WebSocket을 요구한다.
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect products
        run: npm run worker:products
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # 수집이 일부 실패해도 이미 쌓인 대기분은 분석한다.
      - name: Analyze product detail pages
        if: ${{ !cancelled() }}
        run: npm run worker:analyze
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 비우면 기본 gpt-6.1-terra (Settings → Variables에서 바꿀 수 있음)
          PRODUCT_ANALYSIS_MODEL: ${{ vars.PRODUCT_ANALYSIS_MODEL }}
          # 다음 run 깨우기용 — 별도 PAT 없이 기본 토큰을 쓴다.
          GITHUB_DISPATCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
