name: shoot-edit

# 직접 촬영 편집 워커 — 사람이 컷마다 촬영본을 다 올리면(UPLOADED) 컷을 골라 잇고, 세로로 맞추고,
# 화면 문구 · 말 자막을 입히고, 소리 크기를 맞춰 완성본을 만든다(worker/edit-shoots.ts).
# 올리는 즉시 화면이 shoot-edit로 깨운다. schedule(낮 2시간마다)은 트리거가 실패했을 때의 백업.
on:
  schedule:
    # 08 · 10 · … · 22시 KST 17분
    - cron: "17 23,1,3,5,7,9,11,13 * * *"
  repository_dispatch:
    types: [shoot-edit]
  workflow_dispatch:
    inputs:
      request:
        description: "이 촬영 요청만 편집 (비우면 올라온 요청 전부)"
        required: false
      dry_run:
        description: "편집만 하고 저장하지 않기"
        type: boolean
        default: false
      smoke:
        description: "시험 영상으로 음성 · 렌더 점검 (DB · OpenAI 안 씀)"
        type: boolean
        default: false
      smoke_visual:
        description: "점검에 AI 이미지 컷 1개를 넣어 결과 파일로 남기기 (smoke와 함께, OpenAI 약간 씀)"
        type: boolean
        default: false

concurrency:
  group: shoot-edit-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # FFmpeg(편집) + 나눔고딕(화면 문구 글꼴)
      - name: Install ffmpeg and Korean font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-nanum > /dev/null
      # 글자가 상품 · 사람을 피하게 자리를 읽는 도구. 없으면 기본 자리에 둔다
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lib/shoot/video-kit/py/requirements.txt
      - run: pip install -q -r lib/shoot/video-kit/py/requirements.txt
        continue-on-error: true
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: video-models-v1
      # HyperFrames가 렌더에 쓰는 브라우저. 없어도 워커가 기본 편집으로 넘어간다
      - name: Prepare HyperFrames browser
        run: npx --yes hyperframes@0.8.210 browser ensure
        continue-on-error: true
      - name: Check edit kit
        if: ${{ inputs.smoke }}
        run: npm run worker:edit-kit-smoke
        env:
          SMOKE_VOICE: "1"
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ vars.FISH_VOICE_ID }}
          SMOKE_VISUAL: ${{ inputs.smoke_visual && '1' || '' }}
          OPENAI_API_KEY: ${{ inputs.smoke_visual && secrets.OPENAI_API_KEY || '' }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          VIDEO_PYTHON: python
      - name: Keep smoke result
        if: ${{ inputs.smoke_visual && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: edit-kit-smoke
          path: smoke-out
          if-no-files-found: ignore
          retention-days: 3
      # 구매한 자막 모션 스킬은 저장소에 넣지 않고 비공개 저장 공간에서 받는다. 실패하면 기본 자막으로 만든다
      - name: Prepare caption skill
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npx tsx worker/fetch-caption-skill.ts "$RUNNER_TEMP/caption-skill"
          cd "$RUNNER_TEMP/caption-skill/caption-motion-seqc"
          npm ci --no-audit --no-fund --silent
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          echo "CAPTION_SKILL_DIR=$PWD" >> "$GITHUB_ENV"
      # 올린 촬영본에서 사람 없는 제품 컷만 남긴다. 실패해도 편집 결과에는 영향이 없다
      - name: Keep product cuts for AI videos
        if: ${{ !inputs.smoke && !inputs.dry_run }}
        continue-on-error: true
        run: npm run worker:archive-shoots
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VIDEO_PYTHON: python
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
      - name: Edit uploaded shoots
        if: ${{ !inputs.smoke }}
        run: npm run worker:shoot-edit -- ${{ inputs.request && format('--request {0}', inputs.request) || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ vars.FISH_VOICE_ID }}
          SHOOT_BASIC_EDIT: ${{ vars.SHOOT_BASIC_EDIT }}
          VIDEO_PYTHON: python
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
