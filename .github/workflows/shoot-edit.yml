name: shoot-edit

# 직접 촬영 편집 워커 — 사람이 컷마다 촬영본을 다 올리면(UPLOADED) 컷을 골라 잇고, 세로로 맞추고,
# 화면 문구 · 말 자막을 입히고, 소리 크기를 맞춰 완성본을 만든다(worker/edit-shoots.ts).
# 올리는 즉시 화면이 shoot-edit로 깨운다. schedule(낮 2시간마다)은 트리거가 실패했을 때의 백업.
on:
  schedule:
    # 08 · 10 · … · 22시 KST 17분
    - cron: "17 23,1,3,5,7,9,11,13 * * *"
  repository_dispatch:
    types: [shoot-edit]
  workflow_dispatch: {}

concurrency:
  group: shoot-edit-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # FFmpeg(편집) + 나눔고딕(화면 문구 글꼴)
      - name: Install ffmpeg and Korean font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-nanum > /dev/null
      - name: Edit uploaded shoots
        run: npm run worker:shoot-edit
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
