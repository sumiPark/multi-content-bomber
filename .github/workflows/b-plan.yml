name: b-plan

# AI 자동 업로드 워커 — 상품 선정 에이전트(1)가 내일 칸 상품을 제안한다(plan-b-slots.ts).
# 사람이 확인한 칸의 장면표(대본) · 영상은 auto-video 워크플로가 만든다(make-auto-videos.ts, 0054). 확인 버튼이 바로 깨운다.
# 사람은 AI 자동 업로드 화면에서 올릴 시각까지 확인(2시간 전에 알림). 시각이 지나도록 확인이 없으면 건너뛴다.
on:
  schedule:
    # 09:00 KST(00:00 UTC) 다음 날 제안 · 07:10 KST(22:10 UTC) 올릴 시각이 지난 미확인 칸 정리.
    # GitHub schedule은 밀릴 수 있다 — 마감 판단은 화면 · 서버 액션도 시각으로 직접 하므로 정리가 늦어도 확인은 막힌다.
    - cron: "0 0 * * *"
    - cron: "10 22 * * *"
  repository_dispatch:
    types: [plan-b]
  workflow_dispatch: {}

concurrency:
  group: b-plan-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan-b:
    runs-on: ubuntu-latest
    # 분석 전 상품을 고르면 그 자리에서 상세페이지를 분석한다(상품당 1~2분, 0057) — 그만큼 여유를 둔다.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Plan tomorrow's B slots
        run: npm run worker:plan-b
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          # 그 자리 상품 분석 모델(비우면 기본 gpt-6.1-terra) — products.yml과 같은 변수
          PRODUCT_ANALYSIS_MODEL: ${{ vars.PRODUCT_ANALYSIS_MODEL }}
