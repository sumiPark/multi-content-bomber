name: b-plan

# AI 자동 업로드 워커 — 상품 선정 에이전트(1)가 내일 칸 상품을 제안하고(plan-b-slots.ts),
# 사람이 확인한 칸은 기획 · 글 에이전트(2)가 대본을 쓰고 점검 에이전트(4)가 검사한다(write-b-scripts.ts).
# 사람은 AI 자동 업로드 화면에서 올릴 시각까지 확인(2시간 전에 알림). 시각이 지나도록 확인이 없으면 건너뛴다.
on:
  schedule:
    # 09:00 KST(00:00 UTC) 다음 날 제안 · 07:10 KST(22:10 UTC) 올릴 시각이 지난 미확인 칸 정리.
    # GitHub schedule은 밀릴 수 있다 — 마감 판단은 화면 · 서버 액션도 시각으로 직접 하므로 정리가 늦어도 확인은 막힌다.
    - cron: "0 0 * * *"
    - cron: "10 22 * * *"
  repository_dispatch:
    types: [plan-b]
  workflow_dispatch: {}

concurrency:
  group: b-plan-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan-b:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Plan tomorrow's B slots
        run: npm run worker:plan-b
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
      # 확인된 칸의 대본 · 캡션 쓰기 + 점검 (worker/write-b-scripts.ts).
      # 한국어 채점 스크립트(.claude/skills/ig-*-ko)가 파이썬이라 러너의 python3를 쓴다.
      - name: Write scripts for confirmed slots
        if: ${{ !cancelled() }}
        run: npm run worker:b-script
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
